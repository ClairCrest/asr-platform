apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: asr-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: asr-platform-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: asr-platform-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: asr-platform-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: asr-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: asr-platform
data:
  # Pod-based service discovery rather than static targets: worker scales
  # 1-8 replicas under KEDA, so a fixed target list would silently stop
  # covering half the fleet the moment it scaled out. Only pods carrying
  # prometheus.io/scrape: "true" (api and worker; see their Deployments)
  # are scraped, at the port named in prometheus.io/port.
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: asr-platform
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["asr-platform"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: asr-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: asr-platform
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
