# Dev-only default credentials, matching .env.example, so `make kind-up`
# works out of the box on a local kind cluster with zero setup. A real
# deployment must replace this file (or better, remove it from the
# cloud overlay's resources entirely and create the Secret out-of-band —
# `kubectl create secret` from a password manager, External Secrets
# Operator, sealed-secrets, etc.) rather than committing production
# credentials to git.
apiVersion: v1
kind: Secret
metadata:
  name: asr-secrets
  namespace: asr-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "asr"
  DATABASE_URL: "postgres://asr:asr@postgres:5432/asr?sslmode=disable"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  JWT_SECRET: "change-me-in-production"
