apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: asr-platform
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: asr-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Runs migrations before every rollout of a new api version, since
      # there's no Helm here to hang a pre-install/pre-upgrade hook off
      # of. golang-migrate is idempotent (tracks applied versions in
      # schema_migrations), so re-running it on a pod that restarts
      # without a schema change is a safe no-op.
      initContainers:
        - name: migrate
          image: migrate/migrate:v4.19.1
          args:
            - -path=/migrations
            - -database=$(DATABASE_URL)
            - up
          envFrom:
            - secretRef:
                name: asr-secrets
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: asr-api:local
          ports:
            - containerPort: 8080
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: asr-config
            - secretRef:
                name: asr-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
