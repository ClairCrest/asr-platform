apiVersion: v1
kind: ConfigMap
metadata:
  name: asr-config
  namespace: asr-platform
data:
  API_PORT: "8080"
  METRICS_PORT: "9090"
  REDIS_ADDR: "redis:6379"
  S3_ENDPOINT: "minio:9000"
  S3_BUCKET: "asr-audio"
  S3_USE_SSL: "false"
  ACCESS_TOKEN_TTL: "15m"
  REFRESH_TOKEN_TTL: "168h"
  CORS_ALLOWED_ORIGINS: "http://localhost:8080"
  # Must name the model baked into the worker image at build time
  # (worker/Dockerfile's WORKER_MODEL build arg) — see the comment there.
  WORKER_MODEL: "small.en"
  WORKER_CONCURRENCY: "1"
  WORKER_METRICS_PORT: "9091"
  POSTGRES_USER: "asr"
  POSTGRES_DB: "asr"
