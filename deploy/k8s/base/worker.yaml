apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: asr-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      # Waits for Postgres and Redis DNS + TCP to actually be up before
      # the worker starts. Without this, a worker pod scheduled at the
      # same moment as (or just before) those Services' endpoints
      # propagate crashes on its first connection attempt —
      # psycopg.OperationalError: failed to resolve host 'postgres' —
      # and self-heals a few restarts later via CrashLoopBackOff. That
      # self-heals correctly, but it's restart-count noise and a delay
      # KEDA's scale-up doesn't need on top of an already-bursty moment.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432 && nc -z redis 6379; do
                echo "waiting for postgres and redis..."
                sleep 1
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
      containers:
        - name: worker
          image: asr-worker:local
          ports:
            - name: metrics
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: asr-config
            - secretRef:
                name: asr-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # No liveness/readiness probe: /metrics being reachable doesn't
          # prove the worker is actually consuming from Redis, only that
          # the process is alive, and Kubernetes already restarts a
          # crashed container via the default restart policy without
          # one. Liveness is enforced structurally instead — a worker
          # that dies mid-job leaves its lease to expire, and the API's
          # reaper (internal/queue.Reaper) requeues the job for another
          # replica, so a wedged pod costs a lease's worth of delay
          # rather than a stuck job.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
