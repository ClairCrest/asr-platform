<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#556070"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ASR Platform — architecture</text>

  <!-- Browser -->
  <rect x="400" y="60" width="180" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="490" y="91" text-anchor="middle" font-size="14" fill="#0f172a">Browser</text>

  <!-- web -->
  <rect x="60" y="160" width="220" height="70" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="170" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">web</text>
  <text x="170" y="207" text-anchor="middle" font-size="12" fill="#4338ca">React + TS, nginx</text>

  <!-- api -->
  <rect x="380" y="160" width="220" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">api</text>
  <text x="490" y="204" text-anchor="middle" font-size="12" fill="#1d4ed8">Go — auth, jobs,</text>
  <text x="490" y="220" text-anchor="middle" font-size="12" fill="#1d4ed8">WS hub, reaper</text>

  <!-- worker -->
  <rect x="700" y="160" width="220" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="810" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">worker (N replicas)</text>
  <text x="810" y="204" text-anchor="middle" font-size="12" fill="#15803d">Python, stateless,</text>
  <text x="810" y="220" text-anchor="middle" font-size="12" fill="#15803d">faster-whisper</text>

  <!-- Postgres -->
  <rect x="60" y="330" width="200" height="70" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="160" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#581c87">PostgreSQL</text>
  <text x="160" y="376" text-anchor="middle" font-size="12" fill="#7e22ce">job state, transcripts</text>

  <!-- MinIO -->
  <rect x="390" y="330" width="200" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="490" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">MinIO</text>
  <text x="490" y="376" text-anchor="middle" font-size="12" fill="#c2410c">audio + presigned URLs</text>

  <!-- Redis -->
  <rect x="720" y="330" width="200" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="820" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Redis Streams</text>
  <text x="820" y="376" text-anchor="middle" font-size="12" fill="#b91c1c">jobs:pending, group=workers</text>

  <!-- edges: browser to web/api -->
  <line x1="450" y1="112" x2="200" y2="160" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="140" font-size="11" fill="#475569">HTTP</text>
  <line x1="490" y1="112" x2="490" y2="160" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="497" y="140" font-size="11" fill="#475569">REST + WebSocket</text>

  <!-- api <-> postgres -->
  <line x1="440" y1="240" x2="190" y2="330" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- api <-> minio -->
  <line x1="490" y1="240" x2="490" y2="330" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- api -> redis (enqueue) -->
  <path d="M600,200 C 660,200 700,230 715,255" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="600" y="192" font-size="11" fill="#1d4ed8">enqueue (XADD)</text>

  <!-- worker <-> redis -->
  <line x1="825" y1="240" x2="825" y2="330" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="833" y="288" font-size="11" fill="#15803d">XREADGROUP</text>

  <!-- worker <-> postgres (direct writes) -->
  <path d="M700,228 C 400,305 260,305 200,332" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="330" y="322" font-size="11" fill="#15803d">writes status, transcript, job_events</text>

  <!-- worker <-> minio -->
  <path d="M760,240 C 700,280 630,300 592,325" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="700" y="270" font-size="11" fill="#15803d">download audio</text>

  <!-- postgres NOTIFY back to api -->
  <path d="M160,330 C 160,270 300,240 380,210" stroke="#a855f7" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="200" y="255" font-size="11" fill="#7e22ce">LISTEN/NOTIFY → WS push</text>

  <!-- Legend -->
  <rect x="60" y="440" width="860" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="466" font-size="13" font-weight="600" fill="#0f172a">Why the split</text>
  <text x="80" y="490" font-size="12" fill="#334155">The Go api never loads a model — it owns state, delivery guarantees, and the API contract. The Python worker is</text>
  <text x="80" y="508" font-size="12" fill="#334155">stateless and disposable: pull a message, download audio, transcribe, write the result, ack. Either side can die and</text>
  <text x="80" y="526" font-size="12" fill="#334155">restart without losing a job — the reaper (in api) reclaims anything left processing past its lease, and Postgres</text>
  <text x="80" y="544" font-size="12" fill="#334155">LISTEN/NOTIFY (dashed) is what lets the dashboard learn about a worker-driven status change without the worker</text>
  <text x="80" y="562" font-size="12" fill="#334155">ever talking to the API directly.</text>
</svg>
