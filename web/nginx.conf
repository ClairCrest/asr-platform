server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path not matching a real static file falls back to
    # index.html so react-router's client-side routes (e.g. /jobs/{id})
    # work on a hard refresh or a direct link, not just client navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
